name = "sastek-backend"
main = "src/index.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

# admin.sastek.org → CNAME sastek-backend.arda-uca.workers.dev (manually set in Cloudflare DNS)


# ─── D1 Database ─────────────────────────────────────────────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "sastek-db"
database_id   = "291d0fb1-9a76-4bf8-8f55-68cf2379f0ef"

# ─── R2 Bucket ───────────────────────────────────────────────────────────────
[[r2_buckets]]
binding     = "MEDIA"
bucket_name = "sastek-media"

# ─── Secrets (set via: wrangler secret put JWT_SECRET) ───────────────────────
# JWT_SECRET → signing key for auth tokens (never hardcode here)

# ─── Local Dev ────────────────────────────────────────────────────────────────
[dev]
port = 8787
